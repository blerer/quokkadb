[package]
name = "quokkadb"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Embedded application database"
license = "Apache-2.0"
homepage = "https://quokkadb.io"
repository = "https://github.com/blerer/quokkadb"
readme = "README.md"
documentation = "https://docs.rs/quokkadb"

[features]
internal-testing = []

[dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
tempfile = "3.19.1"
serde = { version = "1.0", features = ["derive"] }
crc32fast = "1.4.2"
crossbeam-skiplist = "0.1"
bson = { version = "3.1", features = ["serde"] }
lz4 = "1.28.1"
moka = { version = "0.12", features = ["sync"] }
arc-swap = "1.7.1"
sonyflake = { version = "0.5.1", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
quokkadb_derive = { path = "../quokkadb_derive", version = "0.2.0" }

[dev-dependencies]
trybuild = "1.0"

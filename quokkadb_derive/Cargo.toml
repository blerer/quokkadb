[package]
name = "quokkadb_derive"
version = "0.1.0"
edition = "2021"
description = "Derive macros for QuokkaDB typed application models"
license = "Apache-2.0"
repository = "https://github.com/blerer/quokkadb"
readme = "README.md"
documentation = "https://docs.rs/quokkadb_derive"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

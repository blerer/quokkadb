[package]
name = "quokkadb-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Command-line tools for QuokkaDB"
license = "Apache-2.0"
repository = "https://github.com/blerer/quokkadb"

[[bin]]
name = "quokka"
path = "src/main.rs"

[dependencies]
bson = { version = "3.1", features = ["serde", "serde_json-1"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
quokkadb = { path = "../quokkadb", version = "0.1.0" }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.19.1"

[package]
name = "quokkadb"
version = "0.1.0"
edition = "2021"

[dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
tempfile = "3.19.1"
serde = { version = "1.0", features = ["derive"] }
crc32fast = "1.4.2"
crossbeam-skiplist = "0.1"
bson = { version = "3.1", features = ["serde"] }
lz4 = "1.28.1"
moka = { version = "0.12", features = ["sync"] }
arc-swap = "1.7.1"
sonyflake = "0.5.1"

[dev-dependencies]